version: 0.1
id: pubchem_example
type: DeclarativeSource
description: PubChem PUG-REST single-request example (aspirin, CID 2244)
docs_url: https://pubchem.ncbi.nlm.nih.gov/docs/pug-rest
license: public domain

requester:
  type: HttpRequester
  url_base: https://pubchem.ncbi.nlm.nih.gov/
  path: rest/pug/compound/cid/2244/property/CanonicalSMILES,IsomericSMILES/JSON
  http_method: GET
  headers:
    Accept: application/json
    User-Agent: vacv-qsar/0.1
  authenticator:
    type: NoAuth

paginator:
  type: NoPagination

output:
  extension: json
